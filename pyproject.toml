[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-safe-state-drill"
version = "0.1.0"
description = "Local drill that brings a synthetic tool-using agent to a safe state and writes a clause-mapped evidence card."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ghalbouni Consulting SASU" }]
keywords = ["agents", "safety", "audit", "kill-switch", "governance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.27",
  "pydantic>=2",
  "typer>=0.12",
  "pyjwt>=2.9",
  "pyyaml>=6",
  "jinja2>=3.1",
  "psutil>=6",
]

[project.optional-dependencies]
pdf = ["playwright>=1.48", "pypdf>=5"]
ollama = []
dev = ["pytest>=8", "pytest-timeout>=2", "ruff>=0.7", "pypdf>=5"]

[project.scripts]
ksdrill = "ksdrill.cli:main"

[project.urls]
Homepage = "https://github.com/Ghalbouni-Consulting/agent-safe-state-drill"
Source = "https://github.com/Ghalbouni-Consulting/agent-safe-state-drill"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ksdrill.evidence" = ["templates/*.j2"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
markers = [
  "unit: in-process tests with no requirement on a browser",
  "acceptance: end-to-end drill tests",
]
addopts = "-ra"
testpaths = ["tests"]
timeout = 180
timeout_method = "thread"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]
