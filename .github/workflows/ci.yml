name: ci

on:
  push:
  pull_request:

jobs:
  # AT-24: unit tests on ubuntu, macOS and Windows.
  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Unit tests
        run: pytest -m unit --tb=short

  acceptance:
    name: acceptance (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev,pdf]"
      - name: Chromium for the one-page evidence card
        run: python -m playwright install --with-deps chromium
      - name: Acceptance tests
        run: pytest -m acceptance --tb=short
