  - id: AN-01
    requirement: Emergency stop with access revocation, triggerable by supervision
    source: "ANSSI, Les Essentiels – Sécuriser un système IA agentique, v1.0 (October 2026)"
    url: "https://messervices.cyber.gouv.fr/documents-guides/anssi_essentiels_ia_agentique_1.0.pdf"
    ref: "Principle 6, Limiter l'impact d'un système agentique"
    page: 2
    quote: "Prévoir un arrêt d'urgence avec révocation des accès, déclenchable par un mécanisme de supervision en cas de traitements anormaux."
    verified: true
    verified_on: "2026-11-12"
    note: "English gloss, not official text: provide an emergency stop with access revocation, triggerable by a supervision mechanism on abnormal processing. Landing page: https://messervices.cyber.gouv.fr/guides/essentiels-ia-agentique (published 30 October 2026)."
    demo_step: "S0–S2; supervisor auto-trigger"
    card_field: "Rows S1, S2; trigger line"

