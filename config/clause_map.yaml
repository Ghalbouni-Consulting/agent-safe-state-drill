  - id: AN-04
    requirement: Secrets out of model context, memory and logs; short-lived least-privilege tokens
    source: "ANSSI, Les Essentiels – Sécuriser un système IA agentique, v1.0 (October 2026)"
    url: "https://messervices.cyber.gouv.fr/documents-guides/anssi_essentiels_ia_agentique_1.0.pdf"
    ref: "Principle 6"
    page: 2
    quote: "Maintenir les secrets hors du contexte du modèle, des mémoires et des journaux … jetons d'accès à durée de validité courte, limités aux droits strictement nécessaires."
    verified: true
    verified_on: "2026-11-12"
    note: "English gloss: keep secrets out of the model context, memories and logs; issue short-lived access tokens limited to the rights strictly required. The ellipsis marks text omitted between the two clauses of Principle 6."
    demo_step: "Token broker; AT-02; AT-05"
    card_field: "Line: secrets in logs/transcript"

